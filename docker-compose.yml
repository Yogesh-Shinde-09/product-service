version : "3.0"
 
services:
  product-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-product-service
    ports:
    # map the localo 3500 port  no to the container port no
      - 3500:3500
    environment:
      - NODE_ENV=development
      - PORT: 3500
    volumes:
      - .:/product/src/app  # sync the hot reloading changes
      - /product/src/app/node_modules # prevents the local nod modules with an overwriting